<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JSON Formatter - DevToolbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h1><a href="index.html">DevToolbox</a></h1>
        <div class="menu-toggle" onclick="document.querySelector('.nav-links').classList.toggle('active')">
            <span></span><span></span><span></span>
        </div>
        <div class="nav-links">
            <a href="md5.html">MD5</a>
            <a href="base64.html">Base64</a>
            <a href="json.html" class="active">JSON</a>
            <a href="user-agent.html">User-Agent</a>
        </div>
    </nav>
    <main class="container">
        <div class="tool-card">
            <h2>JSON Formatter</h2>
            <textarea id="input" placeholder="Paste messy JSON here..."></textarea>
            <button onclick="beautify()">Beautify JSON</button>
            <button onclick="navigator.clipboard.writeText(document.getElementById('output').value)">Copy Result</button>
            <p><strong>Result:</strong></p>
            <textarea id="output" readonly placeholder="Formatted JSON will appear here..."></textarea>
        </div>
    </main>
    <script>
        function beautify() {
            const input = document.getElementById('input').value;
            const output = document.getElementById('output');
            try {
                const obj = JSON.parse(input);
                output.value = JSON.stringify(obj, null, 4);
            } catch(e) {
                alert("Invalid JSON format.");
            }
        }
    </script>
</body>
</html>
