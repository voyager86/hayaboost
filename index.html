<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevToolbox | Dev-Focused Toolkit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h1><a href="#" onclick="loadTool('home')">DevToolbox</a></h1>
        <div class="menu-toggle" id="mobile-menu"><span></span><span></span><span></span></div>
        <div class="nav-links" id="nav-list">
            <a href="#" onclick="loadTool('md5')">MD5</a>
            <a href="#" onclick="loadTool('base64')">Base64</a>
            <a href="#" onclick="loadTool('json')">JSON</a>
            <a href="#" onclick="loadTool('url')">URL</a>
            <a href="#" onclick="loadTool('case')">Case</a>
            <a href="#" onclick="loadTool('user-agent')">User-Agent</a>
        </div>
    </nav>

    <main class="container" id="app-content">
        </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        const appContent = document.getElementById('app-content');
        const homeHTML = `<h2>Available Tools</h2><div class="tool-grid">...</div>`; // Keep your grid HTML here

        async function loadTool(toolName) {
            document.getElementById('nav-list').classList.remove('active');
            if (toolName === 'home') { appContent.innerHTML = homeHTML; return; }

            try {
                // Using ./ ensures it works on GitHub Pages subfolders
                const response = await fetch(`./${toolName}.html`);
                if (!response.ok) throw new Error('Tool file not found');
                const htmlText = await response.text();

                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const toolBody = doc.querySelector('main') || doc.body;
                
                // Clear and Inject
                appContent.innerHTML = toolBody.innerHTML;

                // FORCE SCRIPT EXECUTION
                const scripts = toolBody.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    
                    // Copy code and explicitly bind functions to window for global access
                    let scriptCode = oldScript.innerHTML;
                    
                    // Regex trick to ensure functions are global so buttons can see them
                    scriptCode = scriptCode.replace(/function\s+(\w+)/g, 'window.$1 = function');

                    newScript.textContent = scriptCode;
                    document.body.appendChild(newScript);
                    
                    // Immediate cleanup to keep DOM clean
                    document.body.removeChild(newScript);
                });

            } catch (err) {
                console.error(err);
                appContent.innerHTML = `<h2>Error</h2><p>Could not load ${toolName}.html</p>`;
            }
        }

        window.onload = () => loadTool('home');
    </script>
</body>
</html>
