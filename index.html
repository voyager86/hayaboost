<!DOCTYPE html>
<html lang="en" class="dark"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevToolbox | Programming Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="style.css">
    
    <script>
        // Force Tailwind to use class-based dark mode strategy
        window.tailwind = {
            config: {
                darkMode: 'class',
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 flex overflow-hidden">

    <aside class="w-72 bg-slate-900 border-r border-slate-800 h-screen flex flex-col">
        <div class="p-6 border-b border-slate-800">
            <h1 class="text-xl font-bold text-indigo-400 mb-4">DevToolbox</h1>
            <input type="text" id="toolSearch" placeholder="Search 100+ tools..." 
                   class="w-full px-3 py-2 bg-slate-800 text-white border-none rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <nav id="sidebar-nav" class="flex-1 overflow-y-auto p-4 space-y-1">
            </nav>
    </aside>

    <main class="flex-1 h-screen overflow-y-auto p-8 lg:p-12">
        <div id="tool-app" class="max-w-4xl mx-auto">
            </div>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
