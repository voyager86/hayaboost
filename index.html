<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevToolbox | 100+ Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        // Initial theme check to prevent "flash" of white
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 flex overflow-hidden transition-colors duration-300">

    <aside class="w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 h-screen flex flex-col">
        <div class="p-6 border-b border-slate-200 dark:border-slate-800">
            <div class="flex items-center justify-between mb-4">
                <h1 class="text-xl font-bold text-indigo-600 dark:text-indigo-400">DevToolbox</h1>
                <button id="darkToggle" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:ring-2 ring-indigo-500 transition-all">
                    <span id="themeIcon">🌙</span>
                </button>
            </div>
            <input type="text" id="toolSearch" placeholder="Search 100+ tools..." 
                   class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 dark:text-white border-none rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <nav id="sidebar-nav" class="flex-1 overflow-y-auto p-4 space-y-1">
            </nav>
    </aside>

    <main class="flex-1 h-screen overflow-y-auto p-8 lg:p-12">
        <div id="tool-app" class="max-w-4xl mx-auto">
            </div>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
