<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Base64 Converter - DevToolbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h1><a href="index.html">DevToolbox</a></h1>
        <div class="nav-links">
            <a href="md5.html">MD5</a>
            <a href="base64.html" class="active">Base64</a>
            <a href="user-agent.html">User-Agent</a>
        </div>
    </nav>

    <main class="container">
        <div class="tool-card">
            <h2>Base64 Encoder/Decoder</h2>
            <textarea id="input" placeholder="Type or paste here..."></textarea>
            <div class="btn-group">
                <button onclick="convert('encode')">Encode to Base64</button>
                <button onclick="convert('decode')">Decode from Base64</button>
            </div>
            <p><strong>Output:</strong></p>
            <textarea id="output" readonly placeholder="Result will appear here..."></textarea>
        </div>
    </main>

    <script>
        function convert(mode) {
            const val = document.getElementById('input').value;
            const out = document.getElementById('output');
            try {
                out.value = (mode === 'encode') ? btoa(val) : atob(val);
            } catch(e) {
                alert("Invalid input for Base64 operation.");
            }
        }
    </script>
</body>
</html>
