<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MD5 Encryption - DevToolbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h1><a href="index.html">DevToolbox</a></h1>
        <div class="nav-links">
            <a href="md5.html" class="active">MD5</a>
            <a href="base64.html">Base64</a>
            <a href="user-agent.html">User-Agent</a>
        </div>
    </nav>

    <main class="container">
        <div class="tool-card">
            <h2>MD5 Encryption</h2>
            <textarea id="input" placeholder="Paste your text here..."></textarea>
            <p><strong>Resulting Hash:</strong></p>
            <div id="output" class="output-box">...</div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        const input = document.getElementById('input');
        const output = document.getElementById('output');
        
        input.addEventListener('input', () => {
            if(input.value) {
                output.innerText = CryptoJS.MD5(input.value).toString();
            } else {
                output.innerText = "...";
            }
        });
    </script>
</body>
</html>
